name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ['soiliq-backend/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soiliq-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: soiliq-backend/package-lock.json
      - run: npm ci
      - run: npx netlify deploy --prod --dir=. --functions netlify/functions --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} --site ${{ secrets.NETLIFY_SITE_ID }}
